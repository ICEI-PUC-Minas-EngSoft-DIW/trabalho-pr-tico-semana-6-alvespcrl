<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardCompare</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <header class="header">
        <h1>HardCompare</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Peças</a>
            <a href="#">Comparar</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main>

        <section class="banner">
            <h2>Monte seu PC Ideal</h2>
            <p>Compare peças e escolha o melhor desempenho!</p>
            <button>Comparar Peças</button>
        </section>

        <section class="categorias">
            <h2>Categorias</h2>
            <div class="cards">
                <div class="card">CPU</div>
                <div class="card">GPU</div>
                <div class="card">RAM</div>
                <div class="card">SSD</div>
            </div>
        </section>


        <section class="busca">
            <h2>Busca</h2>

            <form class="filtros">
                <input type="text" placeholder="Buscar peças">

                <select>
                    <option>Tipo</option>
                    <option>CPU</option>
                    <option>GPU</option>
                    <option>RAM</option>
                    <option>SSD</option>
                </select>

                <select>
                    <option>Preço</option>
                    <option>Menor Preço</option>
                    <option>Maior Preço</option>
                </select>

                <button type="submit">Buscar</button>
            </form>
        </section>

        <section class="pecas">
            <h2>Lista de Peças</h2>
            <div class="cards">

                <article class="card">
                    <img src="https://picsum.photos/200?random=2" alt="RTX 4060">
                    <h3>RTX 4060</h3>
                    <p>R$ 2000</p>
                    <button>Comparar</button>
                </article>

                <article class="card">
                    <img src="https://picsum.photos/200?random=1" alt="Rx 7600">
                    <h3>Rx 7600</h3>
                    <p>R$ 1800</p>
                    <button>Comparar</button>
                </article>


                <article class="card">
                    <img src="https://picsum.photos/200?random=3" alt="Ryzen 5 5700X">
                    <h3>Ryzen 5 5700X</h3>
                    <p>R$ 1300</p>
                    <button>Comparar</button>
                </article>

            </div>
        </section>


        <section class="destaques">
            <h2>Destaques</h2>
            <p>Melhor custo beneficio RX 7600</p>
        </section>

    </main>

    <footer>
        <a href="#">Contato</a>
        <a href="#">Sobre</a>
        <a href="#">Redes Sociais</a>
        <a href="#">GitHub</a>
    </footer>
</body>

</html>
